<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#10141a" />
  <meta name="apple-mobile-web-app-title" content="ネオダービー" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>ネオ・ダービー 動く壁紙</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #10141a;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #10141a;
    }
    .hint {
      position: fixed;
      left: 50%;
      bottom: calc(1.2rem + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 2;
      max-width: 90vw;
      padding: 0.7rem 0.95rem;
      border-radius: 999px;
      background: rgba(16, 20, 26, 0.55);
      color: rgba(242, 238, 230, 0.88);
      font: 600 0.82rem/1.35 -apple-system, "Hiragino Sans", sans-serif;
      letter-spacing: 0.02em;
      backdrop-filter: blur(8px);
      opacity: 1;
      transition: opacity 0.6s ease;
      pointer-events: none;
      text-align: center;
    }
    .hint.hide { opacity: 0; }
  </style>
</head>
<body>
  <video
    id="wall"
    playsinline
    muted
    loop
    autoplay
    preload="auto"
    poster="https://raw.githubusercontent.com/youmzain-2003/cloud_model/cursor/neo-derby-live-wallpaper-318d/wallpapers/neo-derby-2003/iphone15promax.jpg"
    src="https://raw.githubusercontent.com/youmzain-2003/cloud_model/cursor/neo-derby-live-wallpaper-318d/wallpapers/neo-derby-2003/iphone15promax.mp4"
  ></video>
  <div class="hint" id="hint">共有 → ホーム画面に追加 → このアイコンを開くと動く壁紙</div>
  <script>
    const v = document.getElementById("wall");
    const hint = document.getElementById("hint");
    const play = () => v.play().catch(() => {});
    document.addEventListener("visibilitychange", () => { if (!document.hidden) play(); });
    document.body.addEventListener("touchstart", () => {
      play();
      hint.classList.add("hide");
    }, { passive: true });
    document.body.addEventListener("click", () => {
      play();
      hint.classList.add("hide");
    });
    play();
    setTimeout(() => hint.classList.add("hide"), 5000);
  </script>
</body>
</html>
